<!DOCTYPE html>
<html>
<head>
    <title>Disaster Relief System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('home') }}">Relief System</a>
            <div>
                {% if current_user.is_authenticated %}
                    <a class="btn btn-outline-light btn-sm me-2" href="{{ url_for('dashboard') }}">Dashboard</a>
                    {% if current_user.role == "admin" %}
                        <a class="btn btn-outline-light btn-sm me-2" href="{{ url_for('admin_dashboard') }}">Admin</a>
                    {% endif %}
                    <a class="btn btn-outline-danger btn-sm" href="{{ url_for('logout') }}">Logout</a>
                {% else %}
                    <a class="btn btn-outline-light btn-sm me-2" href="{{ url_for('login') }}">Login</a>
                    <a class="btn btn-light btn-sm" href="{{ url_for('register') }}">Register</a>
                {% endif %}
            </div>
        </div>
    </nav>
    {% block content %}{% endblock %}
</body>
</html>
